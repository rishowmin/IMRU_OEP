version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: imru_oep_app
    container_name: imru_oep_app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html
      - ./vendor:/var/www/html/vendor
      - ./node_modules:/var/www/html/node_modules
    environment:
      APP_ENV: local
      APP_DEBUG: '1'
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: imru_oep
      DB_USERNAME: imru
      DB_PASSWORD: secret
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload

  db:
    image: mysql:8.0
    container_name: imru_oep_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: imru_oep
      MYSQL_USER: imru
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
  vendor:
  node_modules:
