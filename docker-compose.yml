version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: imru_oep_app
    container_name: imru_oep_app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor        # named volume, not host folder
      - node_modules_data:/var/www/html/node_modules
    env_file:
      - .env                                    # load from .env file
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: imru_oep
      DB_USERNAME: imru
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy             # wait until MySQL is ready
    command: >
      sh -c "php artisan key:generate --no-interaction || true &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.0
    container_name: imru_oep_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: imru_oep
      MYSQL_USER: imru
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:                               # app waits for this
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  dbdata:
  vendor_data:
  node_modules_data:
